name: Kalshi feed
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kalshi-feed
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.mjs
      - name: Check outcomes of resolved markets
        run: node resolve.mjs
      - name: Memory — what each series taught us so far
        run: node memory.mjs
      - name: Research — log predictions for markets resolving within hours
        run: node predict.mjs
      - name: Backtest agent — past settled markets (hourly)
        run: node backtest.mjs
        continue-on-error: true
        timeout-minutes: 5
      - name: Update scorecard
        run: node score.mjs
      - name: Progress vs goals
        run: node progress.mjs
      - name: Dashboard feed
        run: node scan.mjs
        continue-on-error: true
      - name: AI picks (free Gemini, hourly)
        run: node agents.mjs
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Dashboard data
        run: node dashboard.mjs
      - name: Save results
        run: |
          git config user.name "kalshi-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bets.json history.json data scorecard.json backtest-scorecard.json progress.json dashboard.json
          git commit -m "Update Kalshi feed" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1

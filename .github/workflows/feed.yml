name: Kalshi feed
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:                      # also run right after a code push to main (the bot's own log pushes never re-trigger it)
    branches: [main]
    paths-ignore: ["data/**", "docs/**"]
permissions:
  contents: write
  pages: write
concurrency:
  group: kalshi-feed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One pipeline cycle (see cycle.sh)
        run: bash cycle.sh
      # A push made with the workflow's own token does not start a Pages build, so ask for one explicitly.
      - name: Rebuild the published page
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::could not request a Pages build"

name: Kalshi feed
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scan.mjs
      - name: AI picks (free Gemini, hourly)
        run: node agents.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Save bets.json
        run: |
          git config user.name "kalshi-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bets.json history.json
          git commit -m "Update Kalshi feed" || exit 0
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalshi Research</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--plane:#f9f9f7;--surface:#fcfcfb;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;--track:#eceae4;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--goodink:#006300;--critink:#a32020;--warnink:#7a5200}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--plane:#0d0d0d;--surface:#1a1a19;--line:#2e2e2b;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;--track:#2a2a27;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--goodink:#4fd24f;--critink:#f08a8a;--warnink:#fab219}}
:root[data-theme=dark]{--plane:#0d0d0d;--surface:#1a1a19;--line:#2e2e2b;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;--track:#2a2a27;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--goodink:#4fd24f;--critink:#f08a8a;--warnink:#fab219}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plane);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--plane);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2);background:var(--surface);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.grow{flex:1}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--mute)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:9px 12px;text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav a.on{color:var(--ink);border-color:var(--ink);font-weight:600}
main{padding:16px 0 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px;font-weight:600}
.card h3{font-size:15px;margin:0 0 2px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.verdict .ans{font-size:22px;font-weight:700;line-height:1.2}
.verdict p{margin:0;color:var(--ink2)}
.tone-bad .ans::before{content:"✕ ";color:var(--crit)}.tone-good .ans::before{content:"✓ ";color:var(--good)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:12.5px}
.mut{color:var(--mute)}.sec{color:var(--ink2)}.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;color:var(--mute);text-align:left;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}tr.row:hover td{background:var(--track)}
.title{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink2);white-space:nowrap}
.tag.good{color:var(--goodink);border-color:var(--good)}.tag.crit{color:var(--critink);border-color:var(--crit)}.tag.warn{color:var(--warnink);border-color:var(--warn)}
.up{color:var(--goodink)}.down{color:var(--critink)}
.flash{animation:fl .6s}@keyframes fl{from{background:var(--track)}to{background:transparent}}
/* interval bar: track = possible range, band = peeking-safe interval, tick = zero, dot = current mean */
.ivl{position:relative;height:22px;background:var(--track);border-radius:4px;margin:6px 0 2px}
.ivl .zero{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;background:var(--ink2)}
.ivl .band{position:absolute;top:6px;bottom:6px;border-radius:4px;background:var(--s1);opacity:.85}
.ivl .band.good{background:var(--good)}.ivl .band.crit{background:var(--crit)}
.ivl .pt{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);transform:translateX(-6px)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.depth{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px}
.lvl{position:relative;display:flex;justify-content:space-between;padding:1px 6px;font-variant-numeric:tabular-nums}
.lvl i{position:absolute;inset:0 auto 0 0;background:var(--s3);opacity:.18;border-radius:3px}
.lvl.no i{background:var(--s2);inset:0 0 0 auto}
.lvl span{position:relative}
.chart{position:relative;height:260px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details{margin-top:8px}summary{cursor:pointer;color:var(--ink2);font-size:13px}
.alert{border-left:4px solid var(--warn);padding:6px 10px;margin:6px 0;background:var(--surface);border-radius:4px;font-size:13.5px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 16px;font-size:13.5px}
.hide{display:none!important}
#drill{position:fixed;inset:0;z-index:20;background:var(--plane);overflow:auto;padding:14px 0 40px}
.spark{vertical-align:middle}
@media (max-width:640px){.title{max-width:170px}.verdict{grid-template-columns:1fr}.verdict .ans{font-size:19px}.hm{display:none}body{font-size:14.5px}.chart{height:220px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>Kalshi Research</h1>
    <span class="pill" id="run" title="Is the live daemon running?"><span class="dot" id="runDot"></span><span id="runTxt">loading…</span></span>
    <span class="pill hm" id="srcPill"></span>
    <span class="grow"></span>
    <button id="theme" title="Dark / light" aria-label="Switch dark or light mode">◐</button>
  </div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="main"><div class="card">Loading…</div></main>
<div id="drill" class="hide"><div class="wrap" id="drillBody"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => x == null ? "–" : (x * 100).toFixed(d) + "¢", n4 = x => x == null ? "–" : (x > 0 ? "+" : "") + (+x).toFixed(4), usd = x => x == null ? "–" : "$" + (+x).toFixed(2);
const ago = t => { if (!t) return "never"; const s = (Date.now() - Date.parse(t)) / 1000; return s < 0 ? "now" : s < 90 ? Math.round(s) + " s ago" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 172800 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const until = t => { const s = (Date.parse(t) - Date.now()) / 1000; if (s <= 0) return "closed"; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = Math.floor(s % 60); return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}:${String(x).padStart(2, "0")}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fee = p => Math.ceil(0.07 * p * (1 - p) * 100 - 1e-9) / 100;
const STATUS = { SUCCESS: ["Passed", "good"], FAILURE_WORSE: ["Worse than market", "crit"], NO_EDGE: ["No edge", ""], RETIRED: ["Off", ""], INSUFFICIENT: ["Too early", ""], SAME_AS_MARKET: ["Same as market", ""], ON_TRACK: ["Leaning better", ""], OFF_TRACK: ["Not better", ""], ACCURATE_NOT_PROFITABLE: ["Accurate, not profitable", "warn"] };
// Series colors follow the entity (fixed order), never its rank.
const PF_COLOR = { cash: "--mute", coin: "--s4", "nn-learn": "--s1", "nn-2": "--s7", "crypto-learn": "--s2", "calib-learn": "--s3", "ensemble-learn": "--s5", maker: "--s8" };
const MODEL_ORDER = ["calib", "ensemble", "nn", "crypto_fair", "ladder", "llm", "weather_nws", "memory", "longshot"];

// ---------- state ----------
const S = { app: null, live: null, health: null, markets: new Map(), spark: new Map(), mode: "…", tab: (location.hash.match(/^#(\w+)$/) || [])[1] || "live", charts: {}, sse: null, err: null };
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const J = async (u, ms = 8000) => { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); try { const r = await fetch(u, { cache: "no-store", signal: c.signal }); if (!r.ok) throw new Error(u + " → " + r.status); return await r.json(); } finally { clearTimeout(t); } };

// ---------- data sources: localhost stream (sub-second) → published live.json (≤ 2 min) ----------
async function loadApp() {
  try { S.app = await J("app.json"); S.err = null; } catch (e) { S.err = "Couldn't load app.json (" + e.message + ")"; }
  render();
}
function takeMarkets(list) {
  for (const m of list || []) { if (!m) continue; const old = S.markets.get(m.k); m._chg = old && old.mid != null && m.mid != null ? Math.sign(m.mid - old.mid) : 0; m._at = Date.now(); S.markets.set(m.k, m);
    if (m.mid != null) { const a = S.spark.get(m.k) || S.spark.set(m.k, []).get(m.k); if (!a.length || a[a.length - 1] !== m.mid) { a.push(m.mid); if (a.length > 80) a.shift(); } } }
}
function connectLive() {
  const bases = LOCAL ? [""] : ["http://localhost:8787", "http://127.0.0.1:8787"];
  (async () => {
    for (const b of bases) {
      try { const st = await J(b + "/api/state", 2500); S.health = st.health; takeMarkets(st.markets); S.mode = "stream"; S.base = b;
        const es = S.sse = new EventSource(b + "/events");
        es.addEventListener("tick", e => { takeMarkets(JSON.parse(e.data)); liveDirty = true; });
        es.addEventListener("health", e => { S.health = JSON.parse(e.data); S.healthAt = Date.now(); header(); });
        es.addEventListener("derived", () => loadApp());
        es.onerror = () => { if (es.readyState === 2) { S.mode = "published"; S.sse = null; setTimeout(connectLive, 5000); header(); } };
        render(); return; } catch {}
    }
    S.mode = "published"; pollLive(); header();
  })();
}
async function pollLive() { if (S.mode !== "published") return; try { const l = await J("live.json"); S.live = l; if (l.health) { S.health = l.health; S.healthAt = Date.parse(l.at); } takeMarkets(l.markets); liveDirty = true; header(); } catch {} }

// ---------- header ----------
function header() {
  const h = S.health, a = S.app, hbAt = S.mode === "stream" ? Date.now() : h ? Date.parse(h.at) : 0, age = h ? (Date.now() - hbAt) / 1000 : Infinity;
  const running = age < 180, ws = h?.ws?.state || "off";
  $("#runDot").className = "dot " + (running ? (h.mode === "ws" ? "good" : "warn") : "crit");
  $("#runTxt").textContent = !h ? "laptop daemon off · cloud updates every ~10 min" : running ? `running on ${h.host} · ${h.mode === "ws" ? "stream live" : ws === "off" ? "REST prices (no key)" : "stream " + ws} · ${h.msgRate || 0} msg/s` : `daemon stopped · last seen ${ago(h.at)}`;
  $("#srcPill").textContent = S.mode === "stream" ? "live from this computer" : `published data · ${a ? ago(a.generated) : "…"}`;
  $("#run").title = h ? `host ${h.host}\nstarted ${h.startedAt}\nstream: ${ws}, reconnects ${h.ws?.reconnects ?? 0}, gaps ${h.ws?.gaps ?? 0}\nmarkets watched ${h.markets}, stale ${h.stale}\nstale seconds since start ${h.staleTotalSec}` : "";
}

// ---------- views ----------
const TABS = [["live", "Live"], ["models", "Models"], ["break", "Breakdowns"], ["paper", "Paper"], ["ops", "Ops"]];
function nav() { $("#nav").innerHTML = TABS.map(([k, n]) => `<a href="#${k}" class="${S.tab === k ? "on" : ""}">${n}</a>`).join(""); }

function verdictCard() {
  const a = S.app, t = a?.status?.trade; if (!t) return "";
  const alerts = (a.ops?.alerts?.recent || []).filter(x => Date.now() - Date.parse(x.ts) < 864e5).slice(-3).reverse();
  const needs = (a.status.needs || []).slice(0, 3);
  return `<div class="card tone-${t.tone}"><h2>Should I trade?</h2><div class="verdict"><div class="ans">${esc(t.answer)}</div><div><p><b>Why${t.tone === "good" ? "" : " not yet"}:</b> ${esc(t.why)}</p><p class="small mut" style="margin-top:4px">${esc(t.next)}</p></div></div>
  ${alerts.map(x => `<div class="alert"><b>${esc(x.title)}</b> — ${esc(x.body)} <span class="mut small">${ago(x.ts)}${x.sent ? "" : " · not sent (no webhook set)"}</span></div>`).join("")}
  ${needs.map(x => `<div class="alert" style="border-color:var(--s1)">${esc(x)}</div>`).join("")}</div>`;
}

function spark(k) { const a = S.spark.get(k); if (!a || a.length < 2) return ""; const lo = Math.min(...a), hi = Math.max(...a), r = hi - lo || 0.01, w = 64, h = 18;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${css("--s1")}" stroke-width="2" stroke-linejoin="round" points="${a.map((v, i) => `${(i / (a.length - 1) * w).toFixed(1)},${(h - 2 - (v - lo) / r * (h - 4)).toFixed(1)}`).join(" ")}"/></svg>`; }
function edge(m, est) { if (est == null || m.a == null || m.b == null) return null; const y = est - m.a - fee(m.a), nc = 1 - m.b, n = (1 - est) - nc - fee(nc); return y >= n ? ["YES", y] : ["NO", n]; }
function liveRows() {
  const a = S.app, logged = new Map((a?.predictions || []).map(p => [p.k, p])), rows = [...S.markets.values()].filter(m => Date.parse(m.res) > Date.now() - 6e4).sort((x, y) => Date.parse(x.res) - Date.parse(y.res));
  if (!rows.length) { const open = (a?.predictions || []).filter(p => p.out === "open"); return open.length ? open.slice(0, 80).map(p => rowHtml({ k: p.k, title: p.title, cat: p.cat, res: p.res, b: p.b, a: p.a, mid: p.mid, est: p.est, stale: true })).join("") : `<tr><td colspan="9" class="mut">No open markets being watched right now.</td></tr>`; }
  return rows.slice(0, 150).map(m => rowHtml({ ...m, est: m.est || logged.get(m.k)?.est })).join("");
}
function rowHtml(m) {
  const best = ["ensemble", "calib", "nn"].map(k => [k, m.est?.[k]]).find(x => x[1] != null), e = best ? edge(m, best[1]) : null;
  return `<tr class="row ${m._chg && Date.now() - m._at < 700 ? "flash" : ""}" data-k="${esc(m.k)}"><td><div class="title" title="${esc(m.title)}">${esc(m.title)}</div><div class="small mut">${esc(m.cat || "")}${m.logged === false ? " · watching" : ""}</div></td>
  <td class="num">${until(m.res)}</td><td class="num">${pct(m.b)}</td><td class="num">${pct(m.a)}</td><td class="num"><b class="${m._chg > 0 ? "up" : m._chg < 0 ? "down" : ""}">${pct(m.mid, 1)}</b></td>
  <td class="hm">${spark(m.k)}</td><td class="num">${m.est?.calib != null ? pct(m.est.calib, 1) : "–"}</td><td class="num hm">${m.est?.ensemble != null ? pct(m.est.ensemble, 1) : "–"}</td>
  <td class="num">${e ? `<span class="${e[1] > 0.02 ? "up" : "mut"}">${e[0]} ${(e[1] * 100).toFixed(1)}¢</span>` : "–"}</td></tr>`;
}
function viewLive() {
  const h = S.health, a = S.app;
  return verdictCard() + `<div class="kpis" style="margin-bottom:14px">
  <div class="kpi"><b>${S.markets.size || (a?.predictions || []).filter(p => p.out === "open").length}</b><span>markets watched</span></div>
  <div class="kpi"><b>${a?.evals?.market?.n ?? "–"}</b><span>live markets resolved</span></div>
  <div class="kpi"><b>${a?.evals?.market?.brier ?? "–"}</b><span>market's own Brier</span></div>
  <div class="kpi"><b>${h ? h.staleTotalSec + " s" : "–"}</b><span>stale time since start</span></div>
  <div class="kpi"><b>${a?.evals?.leakage?.total ?? "–"}</b><span>leakage violations</span></div></div>
  <div class="card"><h2>Live markets <span class="mut" style="text-transform:none;letter-spacing:0">· ${S.mode === "stream" ? "streaming" : "published snapshot, updates every 2 min"} · tap a row for the book and history</span></h2>
  <div class="scroll"><table><thead><tr><th>Market</th><th class="num">Closes in</th><th class="num">Bid</th><th class="num">Ask</th><th class="num">Mid</th><th class="hm">Trend</th><th class="num">Calib</th><th class="num hm">Ensemble</th><th class="num">Edge after fees</th></tr></thead><tbody id="liveBody">${liveRows()}</tbody></table></div>
  <p class="small mut" style="margin:8px 0 0">Edge = expected value per $1 contract after Kalshi's fee, buying at the quoted price, if the model were right. No model has passed the test, so this is not advice.</p></div>`;
}

function interval(seq, snap, status) {
  if (!seq || seq.lo == null) return `<div class="small mut">No resolved live markets yet.</div>`;
  const B = Math.max(0.02, Math.min(seq.bound || 1, Math.max(Math.abs(seq.lo), Math.abs(seq.hi)) * 1.25)), x = v => Math.max(0, Math.min(100, 50 + v / B * 50));
  const cls = seq.hi < 0 ? "good" : seq.lo > 0 ? "crit" : "";
  return `<div class="ivl" role="img" aria-label="Peeking-safe range ${n4(seq.lo)} to ${n4(seq.hi)}"><div class="band ${cls}" style="left:${x(seq.lo)}%;width:${Math.max(1, x(seq.hi) - x(seq.lo))}%"></div><div class="zero"></div>${snap?.diff != null ? `<div class="pt" style="left:${x(snap.diff)}%" title="current average ${n4(snap.diff)}"></div>` : ""}</div>
  <div class="axis"><span>◀ better than market ${n4(-B)}</span><span>0</span><span>${n4(B)} worse ▶</span></div>
  <div class="small sec">Peeking-safe range <b>${n4(seq.lo)} … ${n4(seq.hi)}</b> · average now ${n4(snap?.diff)}</div>`;
}
function trendOf(k) { const t = (S.app.trend || []).map(d => d.predictors?.[k]).filter(x => x && x.mean != null); if (t.length < 2) return "first day of data"; const a = t[t.length - 2], b = t[t.length - 1]; return `${b.n - a.n >= 0 ? "+" : ""}${b.n - a.n} resolved since yesterday · average ${n4(a.mean)} → ${n4(b.mean)}`; }
function modelCard(k) {
  const e = S.app.evals, m = e.models[k], c = e.cards[k] || {}, [lab, tone] = STATUS[m.status] || [m.status, ""], dev = c.development;
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h3>${esc(k)}</h3><span class="tag ${tone}">${esc(lab)}</span></div>
  <div class="small mut">${esc(c.kind || "")}</div>
  ${interval(m.vsMarket.sequence, m.vsMarket.snapshot95, m.status)}
  <div class="small sec" style="margin-top:6px">${m.n} resolved in ${m.events} events · ${m.money.n} picks${m.money.n ? `, ${usd(m.money.total)} after fees` : ""} · ${trendOf(k)}</div>
  <div class="small" style="margin-top:6px">${esc(m.why)}</div>
  <details><summary>Model card</summary><div class="small sec" style="margin-top:6px">
    <p style="margin:4px 0"><b>Idea:</b> ${esc(c.hypothesis || "")}</p>

  if (m) { drill(decodeURIComponent(m[1])); return; }
  $("#drill").classList.add("hide");
  if (!S.app) { $("#main").innerHTML = `<div class="card">${esc(S.err || "Loading…")}</div>`; return; }
  $("#main").innerHTML = (S.err ? `<div class="alert">${esc(S.err)} — showing the last data loaded.</div>` : "") + ({ live: viewLive, models: viewModels, break: viewBreak, paper: viewPaper, ops: viewOps }[S.tab] || viewLive)();
  const bm = $("#bm"); if (bm) bm.onchange = () => { S.bm = bm.value; render(); };
  charts();
}
document.addEventListener("click", e => { const r = e.target.closest("tr.row"); if (r?.dataset.k) location.hash = "#m/" + encodeURIComponent(r.dataset.k); });
addEventListener("hashchange", () => { const t = (location.hash.match(/^#(\w+)$/) || [])[1]; if (t && TABS.some(x => x[0] === t)) S.tab = t; render(); scrollTo(0, 0); });
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"), nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("theme", nx); } catch {} render(); };
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
setInterval(() => { if (S.tab === "live" && !location.hash.startsWith("#m/")) { const b = $("#liveBody"); if (b && (liveDirty || S.mode !== "stream")) { b.innerHTML = liveRows(); liveDirty = false; } } }, 250);   // prices repaint 4×/s; countdowns tick with them
setInterval(header, 1000);
setInterval(() => { if (S.mode === "published") pollLive(); }, 30000);
setInterval(loadApp, 60000);
loadApp(); connectLive();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

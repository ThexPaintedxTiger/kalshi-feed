<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Flow</title><style id="css">
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#14151a;color:#e6e7eb;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:#2a2c35;border:1px solid #3a3d48;border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:#343743}
button.primary{background:#ff6d5a;border-color:#ff6d5a;color:#fff;font-weight:600}
button.primary:hover{background:#ff8270}
button.danger{color:#ff8a80}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:#1c1e25;border:1px solid #363944;border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:120px}
label{display:block;font-size:12px;color:#9a9daa;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
#app-root{display:grid;grid-template-rows:52px 1fr;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #262832;background:#191a20}
header .logo{font-weight:700;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
header .logo span{color:#ff6d5a}
header select{width:auto;max-width:220px}
header .sp{flex:1}
#status{font-size:12px;color:#9a9daa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
main{display:grid;grid-template-columns:220px 1fr 340px;min-height:0}
aside{background:#191a20;overflow:auto;min-height:0}
#palette{border-right:1px solid #262832;padding:12px}
#palette h3,#panel h3{margin:4px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9a9daa}
.pal{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid #2c2f39;border-radius:10px;margin-bottom:6px;cursor:pointer;background:#1f2128;user-select:none}
.pal:hover{border-color:#4a4e5c;background:#252731}
.pal .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.pal small{display:block;color:#8b8e9b;font-size:11px;line-height:1.3}
#canvas{position:relative;overflow:hidden;background-color:#14151a;background-image:radial-gradient(#2b2e38 1px,transparent 1px);background-size:22px 22px;touch-action:none;cursor:grab}
#canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#edges path.e{fill:none;stroke:#5c6070;stroke-width:2.5}
#edges path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
#edges g.sel path.e{stroke:#ff6d5a}
#edges g.live path.e{stroke:#7dd3fc;stroke-dasharray:6 5;animation:dash 0.6s linear infinite}
#edges path.tmp{fill:none;stroke:#ff6d5a;stroke-width:2;stroke-dasharray:5 4}
@keyframes dash{to{stroke-dashoffset:-11}}
.node{position:absolute;width:230px;background:#22242c;border:1.5px solid #353844;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);user-select:none;cursor:move}
.node.sel{border-color:#ff6d5a;box-shadow:0 0 0 3px rgba(255,109,90,.18),0 6px 20px rgba(0,0,0,.35)}
.node .nh{display:flex;align-items:center;gap:9px;padding:10px 12px 6px}
.node .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 25%,transparent);font-size:16px;flex:none}
.node .nm{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .nb{padding:0 12px 11px;color:#9a9daa;font-size:12px;max-height:54px;overflow:hidden}
.node .st{width:10px;height:10px;border-radius:50%;background:#444855;flex:none}
.node[data-status=running] .st{background:#7dd3fc;box-shadow:0 0 0 4px rgba(125,211,252,.2);animation:pulse 1s infinite}
.node[data-status=done] .st{background:#4ade80}
.node[data-status=error] .st{background:#f87171}
.node[data-status=running]{border-color:#7dd3fc}
@keyframes pulse{50%{opacity:.4}}
.port{position:absolute;top:22px;width:16px;height:16px;border-radius:50%;background:#14151a;border:2px solid #737889;cursor:crosshair}
.port:hover{border-color:#ff6d5a;background:#ff6d5a}
.port.in{left:-9px}.port.out{right:-9px}
.node .tag{position:absolute;top:-10px;right:10px;font-size:10px;background:#2f323d;border:1px solid #3c3f4b;border-radius:6px;padding:1px 6px;color:#aeb1bd}
#zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}

#hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:#6f7280;pointer-events:none;text-align:right}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#2a2420;border:1px solid #6b4a2a;color:#fbd5a5;padding:8px 14px;border-radius:10px;font-size:13px;display:none;max-width:80%}
#panel{border-left:1px solid #262832;padding:14px;display:flex;flex-direction:column}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.out-box{margin-top:6px;background:#16171c;border:1px solid #2c2f39;border-radius:10px;padding:10px 12px;font-size:13px;overflow:auto;max-height:46vh}
.out-box h1,.out-box h2,.out-box h3,.out-box h4{font-size:14px;margin:10px 0 4px;color:#fff}
.out-box p{margin:5px 0}.out-box ul,.out-box ol{margin:4px 0;padding-left:20px}
.out-box code{background:#262832;padding:1px 4px;border-radius:4px}
.out-box pre{background:#20222a;padding:8px;border-radius:6px;white-space:pre-wrap}
.muted{color:#8b8e9b;font-size:12px}
#log{margin-top:auto;padding-top:12px;font-size:12px;color:#8b8e9b;max-height:140px;overflow:auto;border-top:1px solid #262832}
#log div{padding:2px 0}
.mobile-tabs{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:20}
#modal.open{display:grid}
#modal .box{background:#1d1f26;border:1px solid #343743;border-radius:14px;padding:18px 20px;width:min(460px,94vw);max-height:90vh;overflow:auto}
#modal h2{margin:0 0 4px;font-size:17px}
#modal a{color:#7dd3fc}
.ok{color:#4ade80}.bad{color:#f87171}

 main{grid-template-columns:1fr}

}

.bh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.bh-row{font-size:12px;margin:7px 0}.bh-bar{height:5px;border-radius:3px;background:#262832;margin-top:3px;overflow:hidden}.bh-bar i{display:block;height:100%}

#dashView{position:fixed;inset:0;z-index:50;background:#111217;display:none;overflow:auto}#dashView.open{display:block}
.dwrap{max-width:1000px;margin:0 auto;padding:16px}.dwrap h4{margin:22px 0 8px;color:#9aa0ad;text-transform:uppercase;font-size:12px;letter-spacing:.06em}

.dst{font-size:12px;text-transform:capitalize}.dst[data-s=done]{color:#4ade80}.dst[data-s=running]{color:#38bdf8}.dst[data-s=error]{color:#f87171}.dst[data-s=idle]{color:#9aa0ad}

.bets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:6px}
.bet{border:1px solid #262832;border-radius:10px;padding:12px;background:#191a20;display:flex;flex-direction:column;gap:6px}
.bt{font-weight:600}.bp{display:flex;align-items:center;gap:8px}.bp b{font-size:20px}.bp .dsp{flex:1}.bn{font-size:12px}

.bet{position:relative}.bet.arb{border-color:#16a34a}
.btag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:#16a34a;color:#04130a}.btag.ai{background:#a78bfa;color:#160b2e}.btag.live{background:#0ea5e9;color:#03141d}
.bp span{font-size:12px}.bedge{font-size:12px;font-weight:700;color:#f87171}.bedge[data-pos=true]{color:#4ade80}

s happen, deadlines, and whether the market price looks too high or too low.","tier":"quick","x":580,"y":240,"output":""},{"id":"ityymdf","type":"agent","icon":"💧","name":"Liquidity & Rules Analyst","color":"#4ade80","instructions":"Use ONLY the Kalshi data in your input — never invent markets, prices or links. For each of the top 10 bets (profit sets first) give one line: title | your win % | confidence (high/med/low) | one-line reason. Judge tradability and resolution risk: spread, volume, settle date, and rule traps (ties, 'other', early close, vague wording). Lower your % when rules are risky.","tier":"quick","x":580,"y":420,"output":""},{"id":"ogcpgor","type":"agent","icon":"🧠","name":"Ensemble Forecaster","color":"#a78bfa","instructions":"You combine three analysts like a neural network's output layer. For each bet: weight each analyst's win % by confidence (high 3, med 2, low 1) and compute the weighted average in a calc block (e.g. fed = (62*3 + 55*2 + 70*1)/6). Edge = your average minus the market price in cents. Keep profit sets that pass the rules check, plus bets with edge of 5 points or more (either side: if the edge is negative, the NO side is the bet — say so). Output: a ranked list with market %, ensemble %, edge, cost, settle date and one-line why, then a bets block: title | ensemble win % | exact kalshi.com link from the data | edge and side.","tier":"default","x":880,"y":240,"output":""},{"id":"8088lqu","type":"agent","icon":"🛡️","name":"Risk Checker","color":"#fb923c","instructions":"Check the Ensemble Forecaster's picks against the Kalshi data: every price, link and date must match; drop picks with spread over 5¢, volume under 500, or risky rules. Suggest a small, equal stake per pick (never more than 2% of a bankroll each). Output a short checklist and a final bets block (same format, exact links).","tier":"quick","x":1170,"y":240,"output":""}],"edges":[{"id":"41gf5dm","from":"0ybf0dn","to":"6hgpbkj"},{"id":"7p40kup","from":"6hgpbkj","to":"eadr $("#kalWf").onclick=()=>{const mk=(n,x,y,o={})=>{const t=tpl(n);return Object.assign({id:uid(),type:t.type,icon:t.icon,name:t.name,color:t.color,instructions:t.instructions,tier:"default",x,y,output:""},o)};
 const A=(icon,name,color,x,y,tier,ins)=>mk("Start",x,y,{type:"agent",icon,name,color,tier,instructions:ins});
 const SPEC="Use ONLY the Kalshi data in your input — never invent markets, prices or links. For each of the top 10 bets (profit sets first) give one line: title | your win % | confidence (high/med/low) | one-line reason. ";
 const s=mk("Start",40,240),d=mk("Kalshi Data",290,240,{instructions:tpl("Kalshi Data").instructions.replace("mode = arbitrage ","mode = all       ")}),
 m=A("📉","Momentum Analyst","#38bdf8",580,60,"quick",SPEC+"Judge from price moves (1h/24h), trading activity and spread: is money flowing in or out, and is the move likely to continue or revert?"),
 b=A("📚","Base-Rate Analyst","#facc15",580,240,"quick",SPEC+"Judge from base rates and what you know: how often events like this happen, deadlines, and whether the market price looks too high or too low."),
 l=A("💧","Liquidity & Rules Analyst","#4ade80",580,420,"quick",SPEC+"Judge tradability and resolution risk: spread, volume, settle date, and rule traps (ties, 'other', early close, vague wording). Lower your % when rules are risky."),
 e=A("🧠","Ensemble Forecaster","#a78bfa",880,240,"default","You combine three analysts like a neural network's output layer. For each bet: weight each analyst's win % by confidence (high 3, med 2, low 1) and compute the weighted average in a calc block (e.g. fed = (62*3 + 55*2 + 70*1)/6). Edge = your average minus the market price in cents. Keep profit sets that pass the rules check, plus bets with edge of 5 points or more (either side: if the edge is negative, the NO side is the bet — say so). Output: a ranked list with market %, ensemble %, edge, cost, settle date and one-line why, then a bets block: title | ensemble win % | exact kalshi.com link from the data | edge and side."),
 r=A("🛡️","Risk Checker","#fb923c",1170,240,"quick","Check the Ensemble Forecaster's picks against the Kalshi data: every price, link and date must match; drop picks with spread over 5¢, volume under 500, or risky rules. Suggest a small, equal stake per pick (never more than 2% of a bankroll each). Output a short checklist and a final bets block (same format, exact links).");
 const E=(p,q)=>({id:uid(),from:p.id,to:q.id});
 const w={id:uid(),name:"Kalshi Neural Forecaster",goal:"Find the best Kalshi bets from live data — report only, never trade. Data layer → three specialist analysts → ensemble → risk check. Prefer safe profit sets, then bets where the combined win chance beats the price.",nodes:[s,d,m,b,l,e,r],edges:[E(s,d),E(d,m),E(d,b),E(d,l),E(d,e),E(m,e),E(b,e),E(l,e),E(e,r),E(d,r)],pan:{x:20,y:20},k:0.75};state.workflows.push(w);switchWf(w.id)};
$("#etsyWf").onclick=()=>{const w=etsyWorkflow();state.workflows.push(w);switchWf(w.id)};

// ---------- view ----------
function applyView(){world.style.transform=`translate(${wf.pan.x}px,${wf.pan.y}px) scale(${wf.k})`}
function toWorld(cx,cy){const r=canvas.getBoundingClientRect();return {x:(cx-r.left-wf.pan.x)/wf.k,y:(cy-r.top-wf.pan.y)/wf.k}}
function zoomAt(f,cx,cy){const r=canvas.getBoundingClientRect();cx=cx??r.left+r.width/2;cy=cy??r.top+r.height/2;const p=toWorld(cx,cy);wf.k=Math.min(2,Math.max(0.3,wf.k*f));wf.pan.x=cx-r.left-p.x*wf.k;wf.pan.y=cy-r.top-p.y*wf.k;applyView()}
canvas.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)},{passive:false});
$("#zIn").onclick=()=>zoomAt(1.2);$("#zOut").onclick=()=>zoomAt(1/1.2);
$("#zFit").onclick=fit;
function fit(){if(!wf.nodes.length)return;const r=canvas.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;wf.nodes.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+230);y1=Math.max(y1,n.y+110)});wf.k=Math.min(1.2,Math.max(0.3,Math.min((r.width-60)/(x1-x0),(r.height-60)/(y1-y0))));wf.pan.x=(r.width-(x1-x0)*wf.k)/2-x0*wf.k;wf.pan.y=(r.height-(y1-y0)*wf.k)/2-y0*wf.k;applyView()}

// ---------- nodes ----------
function preview(n){const t=(n.output||"").replace(/[#*`>]/g,"").trim();return t?t.slice(0,140):(n.type==="trigger"?"Start here · run notes: "+(n.instructions||"none"):n.instructions.slice(0,110))}
function nodeHTML(n){return `<div class="node${sel===n.id?" sel":""}" data-id="${n.id}" data-status="${status[n.id]||(n.output?"done":"idle")}" style="left:${n.x}px;top:${n.y}px;--c:${n.color}">
 ${n.type==="trigger"?"":'<div class="port in"></div>'}<div class="port out"></div>
 ${n.tier&&n.tier!=="default"?`<span class="tag">${n.tier}</span>`:""}
 <div class="nh"><div class="ic">${esc(n.icon)}</div><div class="nm">${esc(n.name)}</div><div class="st"></div></div>
 <div class="nb">${esc(preview(n))}</div></div>`}
function renderNodes(){nodesEl.innerHTML=wf.nodes.map(nodeHTML).join("");renderEdges()}
function updateNode(n){const el=nodesEl.querySelector(`[data-id="${n.id}"]`);if(el)el.outerHTML=nodeHTML(n)}
function addNode(t){const r=canvas.getBoundingClientRect();const c=toWorld(r.left+r.width/2,r.top+r.height/2);const n={id:uid(),type:t.type,icon:t.icon,name:t.name,color:t.color,instructions:t.instructions,tier:"default",x:c.x-115+Math.random()*40,y:c.y-50+Math.random()*40,output:""};wf.nodes.push(n);sel=n.id;selEdge=null;renderNodes();renderPanel();touch()}
function delNode(id){wf.nodes=wf.nodes.filter(n=>n.id!==id);wf.edges=wf.edges.filter(e=>e.from!==id&&e.to!==id);if(sel===id)sel=null;renderNodes();renderPanel();touch()}
const byId=id=>wf.nodes.find(n=>n.id===id);

// ---------- edges ----------
function pathD(x1,y1,x2,y2){const dx=Math.max(50,Math.abs(x2-x1)*0.5);return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`}
function renderEdges(tmp){let h="";for(const e of wf.edges){const a=byId(e.from),b=byId(e.to);if(!a||!b)continue;const d=pathD(a.x+230,a.y+30,b.x,b.y+30);const live=status[b.id]==="running";h+=`<g data-e="${e.id}" class="${selEdge===e.id?"sel":""} ${live?"live":""}"><path class="e" d="${d}"/><path class="hit" d="${d}"/></g>`}if(tmp)h+=`<path class="tmp" d="${tmp}"/>`;svg.innerHTML=h}
svg.addEventListener("pointerdown",e=>{const g=e.target.closest("g[data-e]");if(!g)return;e.stopPropagation();selEdge=g.dataset.e;sel=null;renderNodes();renderPanel()});
function wouldCycle(from,to){const seen=new Set([to]),st=[to];while(st.length){const c=st.pop();if(c===from)return true;wf.edges.filter(e=>e.from===c).forEach(e=>{if(!seen.has(e.to)){seen.add(e.to);st.push(e.to)}})}return false}

// ---------- pointer interactions ----------
let drag=null;
canvas.addEventListener("pointerdown",e=>{
 if(e.target.closest("#zoom")||e.target.closest("g[data-e]"))return;
 const port=e.target.closest(".port.out"),nodeEl=e.target.closest(".node");
 if(port){const n=byId(nodeEl.dataset.id);drag={mode:"link",from:n};e.preventDefault();return}
 if(nodeEl){if(e.target.closest(".port.in"))return;const n=byId(nodeEl.dataset.id);const p=toWorld(e.clientX,e.clientY);drag={mode:"node",n,ox:p.x-n.x,oy:p.y-n.y,moved:false};if(sel!==n.id||selEdge){sel=n.id;selEdge=null;nodesEl.querySelectorAll(".node.sel").forEach(x=>x.classList.remove("sel"));nodeEl.classList.add("sel");renderEdges();renderPanel()}return}
 drag={mode:"pan",sx:e.clientX,sy:e.clientY,px:wf.pan.x,py:wf.pan.y,moved:false};canvas.classList.add("panning");
});
window.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(drag.mode==="pan"){wf.pan.x=drag.px+e.clientX-drag.sx;wf.pan.y=drag.py+e.clientY-drag.sy;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>3)drag.moved=true;applyView()}
 else if(drag.mode==="node"){const p=toWorld(e.clientX,e.clientY);drag.n.x=Math.round(p.x-drag.ox);drag.n.y=Math.round(p.y-drag.oy);drag.moved=true;const el=nodesEl.querySelector(`[data-id="${drag.n.id}"]`);el.style.left=drag.n.x+"px";el.style.top=drag.n.y+"px";renderEdges()}
 else if(drag.mode==="link"){const p=toWorld(e.clientX,e.clientY);renderEdges(pathD(drag.from.x+230,drag.from.y+30,p.x,p.y))}
});
window.addEventListener("pointerup",e=>{
 if(!drag)return;const d=drag;drag=null;canvas.classList.remove("panning");
 if(d.mode==="pan"){if(!d.moved&&(sel||selEdge)){sel=null;selEdge=null;renderNodes();renderPanel()}else if(d.moved)touch()}
 else if(d.mode==="node"){if(d.moved)touch()}
 else if(d.mode==="link"){const t=document.elementFromPoint(e.clientX,e.clientY);let target=null;const nEl=t&&t.closest(".node");if(nEl){const n=byId(nEl.dataset.id);if(n&&n.type!=="trigger")target=n}
  if(target&&target.id!==d.from.id){if(wf.edges.some(x=>x.from===d.from.id&&x.to===target.id))log("Already connected");else if(wouldCycle(d.from.id,target.id))log("That connection would create a loop");else{wf.edges.push({id:uid(),from:d.from.id,to:target.id});touch();log(`Connected ${d.from.name} → ${target.name}`)}}
  renderEdges()}
});
window.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;if(e.key==="Delete"||e.key==="Backspace"){if(sel){delNode(sel)}else if(selEdge){wf.edges=wf.edges.filter(x=>x.id!==selEdge);selEdge=null;renderEdges();renderPanel();touch()}}});

// ---------- markdown ----------
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")}
function md(t){const L=esc(t).split("\n");let h="",list=null,code=false,buf=[];const close=()=>{if(list){h+=`</${list}>`;list=null}};
 for(const l of L){if(/^```/.test(l)){if(code){h+="<pre>"+buf.join("\n")+"</pre>";buf=[];code=false}else{close();code=true}continue}if(code){buf.push(l);continue}
  let m;if((m=l.match(/^(#{1,4})\s+(.*)/))){close();h+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
  else if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=="ul"){close();h+="<ul>";list="ul"}h+=`<li>${inline(m[1])}</li>`}
  else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){close();h+="<ol>";list="ol"}h+=`<li>${inline(m[1])}</li>`}
  else if(!l.trim()){close()}else{close();h+=`<p>${inline(l)}</p>`}}
 close();if(code)h+="<pre>"+buf.join("\n")+"</pre>";return h}

 const P=$("#panelBody");

  return}
 const isT=n.type==="trigger";
 const ups=wf.edges.filter(e=>e.to===n.id).map(e=>byId(e.from)).filter(Boolean);
 P.innerHTML=`<h3>${isT?"Trigger":"Agent"}</h3>
  <div style="display:grid;grid-template-columns:56px 1fr;gap:8px"><div><label>Icon</label><input id="nIcon" value="${esc(n.icon)}" maxlength="4" style="text-align:center"></div><div><label>Name</label><input id="nName" value="${esc(n.name)}"></div></div>
  <label>${isT?"Run notes (passed to the first agents)":n.type==="kdata"?`Settings — then optionally paste data. Copy-paste link: <a href="https://raw.githubusercontent.com/ThexPaintedxTiger/kalshi-feed/main/bets.json" target="_blank" rel="noopener">open the free feed</a> (small) or <a href="${KAPI}" target="_blank" rel="noopener">raw Kalshi data</a>`:n.type==="compute"?"Formulas — one per line, name = expression. Numbers from connected agents are in nums. Free: no AI used.":"Job / instructions"}</label><textarea id="nInst">${esc(n.instructions)}</textarea>
  ${isT?"":`<div style="${["compute","kdata"].includes(n.type)?"display:none":""}"><label>Thinking power</label><select id="nTier"><option value="quick">Quick (fast, simple jobs)</option><option value="default">Balanced</option><option value="complex">Deep (hard jobs, slower)</option></select></div>
  <p class="muted">Gets input from: ${ups.length?ups.map(u=>esc(u.name)).join(", "):"nothing yet — connect an agent into it"}</p>`}
  <div class="row">${isT?"":'<button class="primary" id="runOne">▶ Run this agent</button>'}<button class="danger" id="delN">Delete</button></div>
  ${isT?"":`<label style="display:flex;justify-content:space-between;align-items:center">Output <span><button id="cpy" style="padding:2px 8px;font-size:12px;text-transform:none;letter-spacing:0">Copy</button></span></label>
  <div class="out-box" id="outBox">${n.output?md(n.output):'<span class="muted">No output yet. Run the workflow or this agent.</span>'}</div>`}`;
 $("#nIcon").oninput=e=>{n.icon=e.target.value||"🤖";updateNode(n);touch()};
 $("#nName").oninput=e=>{n.name=e.target.value;updateNode(n);touch()};
 $("#nInst").oninput=e=>{n.instructions=e.target.value;updateNode(n);touch()};
 $("#delN").onclick=()=>delNode(n.id);
 if(!isT){$("#nTier").value=n.tier||"default";$("#nTier").onchange=e=>{n.tier=e.target.value;updateNode(n);touch()};
  $("#runOne").onclick=()=>runWorkflow([n.id]);
  $("#cpy").onclick=async e=>{try{await navigator.clipboard.writeText(n.output||"");e.target.textContent="Copied"}catch(err){e.target.textContent="Copy failed"}setTimeout(()=>e.target.textContent="Copy",1500)}}
}

const INSIDE_CLAUDE=!!(window.claude&&window.claude.use);
const ENGINES={
 claude:{label:"Claude (only inside claude.ai — uses your Claude plan)",key:false},
 gemini:{label:"Google Gemini — free key, best free quality",key:true,keyUrl:"https://aistudio.google.com/apikey",keyName:"Google AI Studio"},
 groq:{label:"Groq — free key, very fast",key:true,keyUrl:"https://console.groq.com/keys",keyName:"Groq",base:"https://api.groq.com/openai/v1",model:"openai/gpt-oss-120b"},
 openrouter:{label:"OpenRouter free models — free key",key:true,keyUrl:"https://openrouter.ai/keys",keyName:"OpenRouter",base:"https://openrouter.ai/api/v1",model:"openrouter/free"},
 ollama:{label:"Ollama — free, runs on your own computer",key:false,base:"http://localhost:11434/v1"}
};
let cfg={engine:INSIDE_CLAUDE?"claude":"gemini",keys:{},models:{}};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("agentflow-engine")||"{}"))}catch(e){}
if(!INSIDE_CLAUDE&&cfg.engine==="claude")cfg.engine="gemini";if(INSIDE_CLAUDE)cfg.engine="claude";
function saveCfg(){try{localStorage.setItem("agentflow-engine",JSON.stringify(cfg))}catch(e){}renderEngBtn()}
function renderEngBtn(){const n={claude:"Claude",gemini:"Gemini (free)",groq:"Groq (free)",openrouter:"OpenRouter (free)",ollama:"Ollama (local)"}[cfg.engine];$("#engBtn").textContent="⚙ AI: "+n}
const sleep=(ms,sig)=>new Promise((r,j)=>{const t=setTimeout(r,ms);if(sig)sig.addEventListener("abort",()=>{clearTimeout(t);j(new Error("stopped"))},{once:true})});
async function listModels(eng,key){
 if(eng==="gemini"){const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key="+encodeURIComponent(key));const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
  return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/gemini/.test(m.name)&&!/image|tts|live|embed|audio|robotics|computer/.test(m.name)).map(m=>m.name.replace("models/",""))}
 const E=ENGINES[eng];const r=await fetch(E.base+"/models",{headers:key?{Authorization:"Bearer "+key}:{}});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
 let ids=(j.data||[]).map(m=>m.id);if(eng==="openrouter"){const free=(j.data||[]).filter(m=>/:free$/.test(m.id)||m.id==="openrouter/free").map(m=>m.id);ids=["openrouter/free",...free.filter(i=>i!=="openrouter/free")]}
 if(eng==="groq")ids=ids.filter(i=>!/whisper|tts|guard|orpheus|playai/.test(i));return ids}
function pickGemini(ids){const f=ids.filter(i=>/flash/.test(i)&&!/lite|preview|exp/.test(i));const pool=f.length?f:ids;return pool.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).pop()}
async function callEngine(prompt,n,signal,onText){
 const eng=cfg.engine;
 if(eng==="claude"){const sample=await getSample();if(!sample)throw {code:"no_claude"};const res=await sample(prompt,{modelTier:n.tier||"default",cache:false,signal,onText:({text})=>onText(text)});return res.text}
 const E=ENGINES[eng],key=cfg.keys[eng]||"";
 if(E.key&&!key)throw {code:"no_key"};
 let model=cfg.models[eng];
 if(!model){if(eng==="gemini"){model=pickGemini(await listModels("gemini",key))}else if(eng==="ollama"){model=(await listModels("ollama"))[0]}else model=E.model;if(!model)throw new Error("No model found");cfg.models[eng]=model;saveCfg()}
 for(let attempt=0;;attempt++){
  let r;
  if(eng==="gemini"){r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}]})})}
  else{const h={"Content-Type":"application/json"};if(key)h.Authorization="Bearer "+key;if(eng==="openrouter"){h["X-Title"]="Agent Flow"}r=await fetch(E.base+"/chat/completions",{method:"POST",signal,headers:h,body:JSON.stringify({model,messages:[{role:"user",content:prompt}]})})}
  if(r.status===429&&attempt<3){const wait=[20,40,60][attempt];log(`Free limit reached — waiting ${wait}s, then retrying ${n.name}`);await sleep(wait*1000,signal);continue}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||("HTTP "+r.status));
  let text=eng==="gemini"?((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join(""):(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
  text=text.replace(/<think>[\s\S]*?<\/think>/g,"").trim();
  if(!text)throw new Error("Empty answer from the AI");onText(text);return text}
}
function openEngine(){
 const M=$("#modal"),B=$("#modalBox");M.classList.add("open");
 const draw=()=>{const eng=cfg.engine,E=ENGINES[eng];
